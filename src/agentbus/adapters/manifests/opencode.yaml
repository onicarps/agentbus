sources:
  - id: opencode-v1-docs
    resource: https://opencode.ai/docs/mcp-servers/
    title: OpenCode v1 MCP configuration (mcp.<name>, enabled)
  - id: opencode-v2-docs
    resource: https://dev.opencode.ai/v2/docs/mcp-servers/
    title: OpenCode v2 MCP configuration (mcp.servers.<name>, disabled)
notes: >-
  OpenCode ships two incompatible MCP layouts that share one config filename.
  v1 stores servers directly under "mcp" with "enabled": true; v2 stores them
  under "mcp.servers" with "disabled": false, and the whole argv lives in one
  "command" array with the environment under "environment". At most one
  variant is ever connected. Selection order is: explicit --client
  opencode-v1/opencode-v2, then $schema markers, then a bounded
  "opencode --version" probe, then structural analysis. Disagreeing or absent
  signals fail closed with an actionable error instead of guessing v2.
approval:
  mode: restart
  guidance: >-
    Start a new OpenCode session and run its MCP status command to confirm the
    agentbus server is connected.
