services:
  agentbus-stdio:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: agentbus-stdio
    profiles: ["experimental"]
    stdin_open: true
    tty: true
    environment:
      - AGENTBUS_WORKSPACE=/data/workspace
    volumes:
      - agentbus-data:/data/workspace

  posthog-streamer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: agentbus-posthog-streamer
    profiles: ["telemetry"]
    restart: "no"
    environment:
      - AGENTBUS_WORKSPACE=/data/workspace
      - POSTHOG_API_KEY=${POSTHOG_API_KEY:-}
      - POSTHOG_HOST=${POSTHOG_HOST:-https://us.i.posthog.com}
    volumes:
      - agentbus-data:/data/workspace
    command: ["posthog", "stream", "--workspace", "/data/workspace"]

volumes:
  agentbus-data:
    driver: local
